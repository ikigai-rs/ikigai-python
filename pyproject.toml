[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikigai"
version = "0.1.0"
description = "Pure-Python client and servable peer for the ikigai wire protocol (resource-oriented computing over Unix domain sockets)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "Brian Sletten" }]
keywords = ["ikigai", "resource-oriented", "roc", "rdf", "ipc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Zero runtime dependencies, deliberately: the codec and transport are stdlib
# (socket / asyncio / struct), mirroring the kernel's runtime-free posture.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# The examples/ REST faces. Minima are the versions the smoke tests were
# built and verified against.
examples = [
  "litestar>=2.22",  # FromPath/FromQuery landed in 2.22
  "falcon>=4",
  "python-fasthtml>=0.13.1",  # the Lifespan class our async-gen lifespan rides on
  "httpx>=0.27",  # litestar's and starlette's test clients ride on it
]

[project.urls]
Homepage = "https://github.com/ikigai-rs/ikigai-python"

[tool.hatch.build.targets.wheel]
packages = ["src/ikigai"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples", "."]
# Prose code blocks are formatted for reading, not to the formatter's taste.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The examples/ package lives at the repo root (it is not shipped in the
# wheel); the smoke tests import it, so put the root on sys.path.
pythonpath = ["."]
# A test-support thread dying on an unhandled exception must FAIL the run.
# As a mere warning it once masked a real defect: the stub server crashed on
# every hello frame, so every stub-based client test silently exercised the
# legacy-reconnect fallback instead of the v6 wire path.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = [
  "wire_v7_legacy: exercises the pre-v6 one-version tolerance; delete with the tolerance at wire v7",
]
