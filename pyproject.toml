[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikigai"
version = "0.1.0"
description = "Python client and servable peer for the ikigai wire protocol (resource-oriented computing over Unix domain sockets)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "Brian Sletten" }]
keywords = ["ikigai", "resource-oriented", "roc", "rdf", "ipc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# ONE runtime dependency, and only one: the codec and transport are stdlib (socket /
# asyncio / struct), mirroring the kernel's runtime-free posture, but a served door's
# contract IRI is a BLAKE3 digest (urn:ikigai:contract:{id}:{verb}:b3:{hex}, ledger
# #948/#1034) and hashlib has no BLAKE3. `blake3` is the reference binding (its author
# co-designed BLAKE3) over the same Rust crate ikigai-core hashes with. The floor is
# 1.0: the first stable release, and blake3()/update()/hexdigest() are all this uses;
# the ceiling is the next major, the one place that API may change.
dependencies = ["blake3>=1.0,<2"]

[project.optional-dependencies]
# `build` and `twine` are here because the packaging gate is a gate like any
# other: scripts/gates.sh builds the sdist + wheel and runs `twine check` on
# both, so the README/metadata that PyPI will render is checked on every run.
# NOTHING here uploads — publishing is Brian's, and the publish fence refuses
# `twine upload` anyway.
dev = ["pytest>=8", "ruff>=0.5", "build>=1", "twine>=6"]
# The QUIC transport (`ikigai.quic`): a remote door over QUIC with pinned certificates,
# the way ikigai-cli's `ikigai-quic` speaks. Optional, and nothing outside that module
# imports it, so the Unix-socket client never needs it. The floor is the oldest aioquic
# the suite was run against (tests/test_quic.py and tests/test_quic_interop.py, on
# Python 3.11 with cryptography 42.0.0); the ceiling is aioquic's next major, the one
# place its protocol and configuration API may change. `cryptography` is named because
# the module imports it directly (certificate and key loading); aioquic already
# requires it, and 42 is the floor aioquic 1.2 itself sets.
quic = ["aioquic>=1.2,<2", "cryptography>=42"]
# The examples/ REST faces. Minima are the versions the smoke tests were
# built and verified against.
examples = [
  "litestar>=2.22",  # FromPath/FromQuery landed in 2.22
  "falcon>=4",
  "python-fasthtml>=0.13.1",  # the Lifespan class our async-gen lifespan rides on
  "httpx>=0.27",  # litestar's and starlette's test clients ride on it
]

[project.urls]
Homepage = "https://github.com/ikigai-rs/ikigai-python"
Repository = "https://github.com/ikigai-rs/ikigai-python"
Issues = "https://github.com/ikigai-rs/ikigai-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ikigai"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples", "."]
# Prose code blocks are formatted for reading, not to the formatter's taste.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D1"]

# The docstring gate covers the PUBLIC API: D1 is "docstring missing" over
# src/, so every public module, class, method, function and __init__ in the
# shipped package states what it is and the constraint its type cannot show.
# tests/ and examples/ are not shipped and their names ARE their docstrings
# (`test_<what>_<expectation>`), so requiring a docstring on each would be
# noise; they are excluded here, not from ruff entirely.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"examples/**" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The examples/ package lives at the repo root (it is not shipped in the
# wheel); the smoke tests import it, so put the root on sys.path.
pythonpath = ["."]
# A test-support thread dying on an unhandled exception must FAIL the run.
# As a mere warning it once masked a real defect: the stub server crashed on
# every hello frame, so every stub-based client test silently exercised the
# legacy-reconnect fallback instead of the v6 wire path.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
