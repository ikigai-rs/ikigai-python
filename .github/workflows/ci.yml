name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev,examples]'
      - name: Gates (ruff check · ruff format --check · pytest)
        # The same script `just gates` runs locally, so the two cannot drift.
        # Integration tests that need the `ikigai` binary skip themselves
        # when it is absent (CI has no Rust host; they run locally).
        run: scripts/gates.sh python
