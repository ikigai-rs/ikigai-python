name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev,examples,quic]'
      - name: Gates (ruff check · ruff format --check · pytest)
        # The same script `just gates` runs locally, so the two cannot drift.
        # Integration tests that need the `ikigai` binary skip themselves
        # when it is absent here; the `interop` job below runs the QUIC ones
        # against a real Rust door.
        run: scripts/gates.sh python

  interop:
    # The WHOLE suite with the REAL Rust door on PATH: ikigai-cli built from crates.io with
    # its `quic` feature, `--locked` (the lock it was published with), and cached by version
    # so only a version bump rebuilds it. The `test` job skips every host-backed test (no
    # binary); here they run: the QUIC client (tests/test_quic_interop.py), both directions
    # over a Unix socket (tests/test_integration.py), and the v9 door's IssueWith and error
    # classes (tests/test_issue_with.py). It also builds ikigai-tutorial's `ttt-host` for the
    # tic-tac-toe parity test (tests/test_tictactoe_app.py), which drives that binary, not the
    # `ikigai` cli, so the cli pin does not cover it. `--require-interop` turns a missing
    # binary, either one, into a FAILURE: a skipped interop suite would pass green while
    # covering nothing. Move IKIGAI_CLI_VERSION to follow the door.
    runs-on: ubuntu-latest
    env:
      IKIGAI_CLI_VERSION: "0.2.8"
      # The ikigai-tutorial commit ttt-host is built from. It moves when the tutorial changes
      # what ttt-host answers (its views, refusals, routes or caching): move it to the
      # tutorial's main, run the parity test against a ttt-host built there, and bring the
      # Python face up to date in the same PR.
      TTT_HOST_REV: "8c30fe704537c1a87ca384e6e5de1ab4443827d6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the ikigai binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ikigai
          key: ikigai-cli-${{ env.IKIGAI_CLI_VERSION }}-quic-${{ runner.os }}
      - name: Build ikigai-cli (quic)
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install ikigai-cli --version "$IKIGAI_CLI_VERSION" --locked --features quic
      - name: Put the binary on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/ikigai" --version
      - name: Cache ttt-host
        id: ttt-cache
        uses: actions/cache@v4
        with:
          path: ~/ttt-host
          key: ttt-host-${{ runner.os }}-${{ env.TTT_HOST_REV }}
      - name: Build ttt-host
        if: steps.ttt-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/ikigai-rs/ikigai-tutorial
          --rev "$TTT_HOST_REV" --locked ttt-host --root ~/ttt-host
      - name: Name ttt-host for the parity test
        run: |
          test -x "$HOME/ttt-host/bin/ttt-host"
          echo "TTT_HOST=$HOME/ttt-host/bin/ttt-host" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e '.[dev,examples,quic]'
      - name: Interop (the whole suite, against a local Rust door)
        run: python -m pytest -q --require-interop
